name: 功能建议 / Feature request
description: 提出功能想法或改进建议
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提议前请先读 [docs/FEATURES.md](../blob/main/docs/FEATURES.md) 的
        「当前边界」，很多“缺失”是有意的设计取舍。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem
      description: 描述你遇到的使用场景，而不是直接给方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives
  - type: checkboxes
    id: constraints
    attributes:
      label: 约束确认 / Constraints
      description: 本项目的两条产品红线
      options:
        - label: 我确认该功能不需要联网 / 上传（local-first 红线）
        - label: 我接受该功能可能需要作为可选项存在（默认不改变现有行为）
